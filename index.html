<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bellavié Co. · Order Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --petal:#fff5f7; --blush:#fbdfe7; --blush2:#f5c3d3; --rose:#e27b9b; --berry:#b13a64; --berry-d:#8f2a50;
  --cocoa:#4a2833; --mauve:#86606e; --pearl:#fffdfd; --gold:#c39a72; --sage:#2f8a5c; --sage-bg:#e5f4ec;
  --line:#f2cbd8; --warn:#9a4a12; --warn-bg:#fff0dc; --err:#a3243f; --err-bg:#ffe6ea;
  --r:24px;
  --serif:'Cormorant Garamond','Playfair Display',Georgia,serif;
  --script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --sans:'Jost','Avenir Next','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--sans);font-size:16px;line-height:1.5;color:var(--cocoa);
  background-color:#fff8fa;
  background-image:linear-gradient(90deg,rgba(236,150,178,.15) 50%,transparent 50%),linear-gradient(rgba(236,150,178,.15) 50%,transparent 50%);
  background-size:30px 30px;
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 140px}
.hide{display:none!important}
:focus-visible{outline:3px solid var(--rose);outline-offset:3px;border-radius:12px}

/* ---------- type */
.script{font-family:var(--script);font-weight:400;color:var(--berry);line-height:1.05}
.serif{font-family:var(--serif)}
.h-xl{text-wrap:balance;font-family:var(--serif);font-weight:600;font-size:clamp(32px,8vw,42px);line-height:1.08;letter-spacing:.2px}
.h-lg{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.15}
.h-md{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.2}
.muted{color:var(--mauve)}
.small{font-size:14px}
.tiny{font-size:13px}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums}

/* ---------- surfaces */
.card{
  background:var(--pearl);border:1.5px solid var(--line);border-radius:var(--r);padding:20px;
  box-shadow:0 14px 34px -22px rgba(177,58,100,.45);margin-bottom:16px;position:relative;
}
.stitched::after{content:"";position:absolute;inset:8px;border:1.5px dashed var(--blush2);border-radius:calc(var(--r) - 8px);pointer-events:none}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:12px;align-items:center}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.divider{height:14px;margin:18px 0;background:radial-gradient(circle at 7px 0,transparent 6px,var(--blush2) 6.5px,var(--blush2) 7.5px,transparent 8px) 0 0/14px 14px repeat-x;opacity:.8}

/* ---------- buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:62px;padding:14px 24px;
  border:0;border-radius:999px;font-weight:600;font-size:18px;cursor:pointer;text-decoration:none;text-align:center;
  background:var(--berry);color:#fff;box-shadow:0 10px 22px -12px rgba(177,58,100,.8), inset 0 2px 0 rgba(255,255,255,.25);
  transition:transform .15s ease, background .15s ease;
}
.btn:hover{background:var(--berry-d)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--berry);border:2px solid var(--blush2);box-shadow:none}
.btn.ghost:hover{background:var(--blush)}
.btn.soft{background:var(--blush);color:var(--berry-d);box-shadow:none}
.btn.wa{background:var(--sage);box-shadow:0 10px 22px -12px rgba(47,138,92,.8), inset 0 2px 0 rgba(255,255,255,.25)}
.btn.wa:hover{background:#25784f}
.btn.danger{background:transparent;color:var(--err);border:2px solid #f3b9c4;box-shadow:none}
.btn.sm{min-height:44px;font-size:15px;padding:8px 18px;width:auto}
.btn svg{flex:none}
.linkbtn{background:none;border:0;color:var(--berry);font-weight:600;cursor:pointer;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--pearl);display:grid;place-items:center;cursor:pointer;color:var(--berry);flex:none}
.iconbtn:hover{background:var(--blush)}

/* ---------- welcome */
.hero{padding:66px 22px 28px;margin-top:54px;text-align:center}
.bow{position:absolute;left:50%;top:-50px;width:150px;transform:translateX(-50%);filter:drop-shadow(0 8px 10px rgba(177,58,100,.3))}
.bow.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:translateX(-50%) scale(.2) rotate(-14deg);opacity:0}100%{transform:translateX(-50%) scale(1) rotate(0);opacity:1}}
.hero .script{font-size:clamp(50px,15vw,68px)}
.hero p.lead{max-width:36ch;margin:10px auto 0;color:var(--mauve);font-size:17px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:12px 16px;margin-top:18px;font-weight:500;text-align:left}
.choices{display:grid;gap:14px;margin-top:26px;text-align:left}
.choice{
  display:flex;align-items:center;gap:16px;width:100%;min-height:104px;padding:18px 20px;border-radius:26px;cursor:pointer;
  border:2px solid var(--blush2);background:linear-gradient(135deg,#fff 0%,var(--blush) 140%);text-align:left;color:var(--cocoa);
  box-shadow:0 12px 24px -18px rgba(177,58,100,.7);transition:transform .15s ease, border-color .15s;
}
.choice:hover{border-color:var(--rose);transform:translateY(-2px)}
.choice .t{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.1}
.choice .s{color:var(--mauve);font-size:15px;margin-top:4px}
.choice .go{margin-left:auto;color:var(--berry)}
.choice .badge-ico{flex:none;width:54px;height:54px;border-radius:50%;background:var(--berry);display:grid;place-items:center;color:#fff}
.closed-tag{display:inline-block;margin-top:6px;background:var(--err-bg);color:var(--err);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
footer.foot{margin-top:26px;text-align:center;color:var(--mauve);font-size:14px}
footer.foot a,footer.foot button{color:var(--mauve)}

/* ---------- top bar */
.top{display:flex;align-items:center;gap:12px;margin:6px 0 16px}
.top .ttl{font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.1}
.top .sub{color:var(--mauve);font-size:14px}

/* ---------- how it works */
.how{background:var(--blush);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.how summary svg{color:var(--berry)}
.how summary{cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px;min-height:32px}
.how summary::-webkit-details-marker{display:none}
.how ul{margin:10px 0 0;padding-left:20px}
.how li{margin:4px 0}

/* ---------- inputs */
label.f{display:block;font-weight:500;margin-bottom:6px}
.in{
  width:100%;min-height:54px;padding:12px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;font-size:17px;
}
.in:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 4px rgba(226,123,155,.2)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--berry) 50%),linear-gradient(135deg,var(--berry) 50%,transparent 50%);background-position:calc(100% - 22px) 24px,calc(100% - 16px) 24px;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.field{margin-bottom:16px}
.hint{font-size:14px;color:var(--mauve);margin-top:6px}
.search{position:relative}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mauve)}
.search .in{padding-left:46px}
.cats{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 8px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.catchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-weight:500;cursor:pointer;min-height:46px;font-size:15px;white-space:nowrap}
.catchip small{color:var(--mauve);font-size:13px;margin-left:4px}
.catchip[aria-pressed="true"]{background:var(--berry);color:#fff;border-color:var(--berry)}
.catchip[aria-pressed="true"] small{color:#ffd9e5}
.cathead{font-family:var(--serif);font-size:25px;font-weight:700;margin:26px 4px 12px;display:flex;align-items:baseline;gap:10px;color:var(--cocoa);line-height:1.1}
.cathead::after{content:"";flex:1;border-top:2px dotted var(--blush2);transform:translateY(-5px)}
.cathead small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--mauve);white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:500;cursor:pointer;min-height:42px;font-size:15px}
#chips .chip{min-height:38px;padding:6px 14px;font-size:14px;background:transparent;border-style:dashed}
#chips .chip[aria-pressed="true"]{background:var(--blush);color:var(--berry-d);border-style:solid;border-color:var(--rose)}
.chip[aria-pressed="true"]{background:var(--berry);border-color:var(--berry);color:#fff}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg.two{grid-template-columns:1fr 1fr}
.opt{
  min-height:76px;border-radius:20px;border:2px solid var(--line);background:#fff;cursor:pointer;padding:10px 8px;text-align:center;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:17px;
}
.opt small{font-weight:500;color:var(--mauve);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--berry);background:var(--blush);box-shadow:0 0 0 3px rgba(177,58,100,.15)}
.opt[aria-pressed="true"] small{color:var(--berry-d)}
.opt.big{min-height:112px;border-radius:24px;font-family:var(--serif);font-size:24px;font-weight:700}
.opt.big .pr{font-family:var(--sans);font-size:20px;color:var(--berry);font-weight:600}

/* ---------- product list */
.group{background:var(--pearl);border:1.5px solid var(--line);border-radius:22px;margin-bottom:10px;overflow:hidden}
.ghead{
  width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;text-align:left;padding:14px 16px;min-height:64px;
}
.ghead .nm{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.15}
.ghead .fr{font-size:14px;color:var(--mauve)}
.ghead .chev{margin-left:auto;transition:transform .2s;color:var(--berry)}
.group.open .chev{transform:rotate(180deg)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:600;margin-left:6px;vertical-align:middle}
.tag.cart{background:var(--berry);color:#fff}
.tag.kit{background:var(--warn-bg);color:var(--warn)}
.tag.ok{background:var(--sage-bg);color:var(--sage)}
.tag.bad{background:var(--err-bg);color:var(--err)}
.tag.plain{background:var(--blush);color:var(--berry-d)}
.variants{border-top:1.5px dashed var(--line)}
.vrow{padding:14px 16px;border-top:1px solid #f7e2e9}
.vrow:first-child{border-top:0}
.vtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vspec{font-weight:600;font-size:17px}
.vprice{font-weight:600;font-size:19px;color:var(--berry);white-space:nowrap}
.vprice small{font-weight:500;color:var(--mauve);font-size:13px}
.vkit{color:var(--mauve);font-size:14px}
.vbot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:2px solid var(--blush2);border-radius:999px;background:#fff}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:none;font-size:26px;line-height:1;color:var(--berry);cursor:pointer;font-weight:500}
.stepper button:hover{background:var(--blush)}
.stepper input{width:54px;border:0;text-align:center;font-size:19px;font-weight:600;background:none;height:48px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.stepper input:focus{outline:none}
.dots{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--blush2);background:#fff}
.dot.on{background:var(--rose);border-color:var(--rose)}
.dot.mine{background:var(--berry);border-color:var(--berry)}
.kitnote{font-size:14px;margin-top:6px;color:var(--warn);font-weight:500}
.kitnote.ok{color:var(--sage)}
.modes{display:flex;gap:6px;margin:10px 0 2px;background:var(--blush,#fde7ee);padding:4px;border-radius:999px;width:fit-content}
.modes button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;color:inherit;font-family:inherit}
.modes button.on{background:#fff;box-shadow:0 1px 4px rgba(190,80,110,.25);color:var(--rose-deep,#b04a6a)}
.waline{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.proofimg{width:100%;border-radius:14px;border:1.5px solid var(--line);display:block;background:#fff}
.qrimg{width:min(260px,72%);border-radius:14px;border:1.5px solid var(--line);background:#fff;padding:8px;display:block;margin:0 auto 12px}
.pre{white-space:pre-wrap;word-break:break-word}
.fillbtn{background:var(--warn-bg);color:var(--warn);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px}

.cartbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,245,247,0),var(--petal) 30%);
}
.cartbar .in-bar{max-width:640px;margin:0 auto;background:var(--pearl);border:2px solid var(--blush2);border-radius:999px;padding:8px 8px 8px 22px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 30px -14px rgba(177,58,100,.6)}
.cartbar .sum{flex:1;line-height:1.25}
.cartbar .sum b{font-size:18px}
.cartbar .btn{width:auto;min-height:54px;padding:10px 24px;font-size:17px}

/* ---------- summary & invoice */
.line .num{white-space:nowrap}
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.line.total{border-top:2px dashed var(--blush2);margin-top:8px;padding-top:12px;font-family:var(--serif);font-size:30px;font-weight:700;color:var(--berry)}
.item{padding:12px 0;border-top:1px dashed var(--line)}
.item:first-child{border-top:0}
.alert{border-radius:16px;padding:12px 16px;font-weight:500;margin:12px 0}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.ok{background:var(--sage-bg);color:var(--sage)}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.refbox{
  text-align:center;border:2px dashed var(--rose);border-radius:22px;padding:16px 12px;background:var(--blush);
}
.refbox .code{font-family:var(--serif);font-weight:700;font-size:clamp(19px,5.6vw,28px);color:var(--berry-d);white-space:nowrap;user-select:all}
.receipt{background:#fff;border:1.5px solid var(--line);border-radius:6px 6px 22px 22px;padding:20px 18px;position:relative;margin-top:6px}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;background:radial-gradient(circle at 8px 8px,transparent 7px,#fff 7.5px) 0 0/16px 8px repeat-x}
.success-bow{width:96px;margin:0 auto 6px;display:block}

/* ---------- modal */
.scrim{position:fixed;inset:0;background:rgba(74,40,51,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal{background:var(--pearl);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(min-width:700px){.scrim{align-items:center}.modal{border-radius:28px}}
.toast{width:max-content;max-width:min(90vw,420px);position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--cocoa);color:#fff;padding:12px 22px;border-radius:999px;z-index:80;font-weight:500;max-width:90vw;text-align:center}

/* ---------- admin */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.tabs .chip{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--pearl);border:1.5px solid var(--line);border-radius:18px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:26px;color:var(--berry);line-height:1.1}
.stat span{font-size:13px;color:var(--mauve)}
.ocard{background:var(--pearl);border:1.5px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.ocard:hover{border-color:var(--rose)}
.ocard .ref{font-family:var(--serif);font-weight:700;font-size:19px;color:var(--berry-d)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.filters .in{min-height:48px;font-size:15px;padding:8px 14px}
.filters .full{grid-column:1/-1}
.filters .search .in{padding-left:46px}
.irow{display:grid;grid-template-columns:1fr 84px 36px;gap:8px;align-items:center;margin-bottom:8px}
.irow .in{min-height:48px;padding:8px 10px;font-size:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kbar{height:10px;background:var(--blush);border-radius:99px;overflow:hidden;margin-top:6px}
.kbar i{display:block;height:100%;background:var(--rose);border-radius:99px}
.loading{padding:80px 20px;text-align:center}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--blush);border-top-color:var(--berry);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
@media print{body{background:#fff}.btn,.cartbar,.top,footer{display:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spin"></div><p class="serif h-md">Tying the bows…</p></div></div>
<div id="layer"></div>

<script>
/* ===================================================================
   Bellavié Co. order website — client
   =================================================================== */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => '₱' + Number(n || 0).toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const when = iso => { try { return new Date(iso).toLocaleString('en-PH', {dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Manila'}); } catch (e) { return ''; } };
const REGIONS = ['Luzon', 'Visayas', 'Mindanao'];

const ICON = {
  down: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>',
  card: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M6 15h4"/></svg>',
  up: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>',
  back: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev: '<svg class="chev" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',

/* ---------------- kits (bunuan) */
function kitBase(p) {
  const k = S.kits[byKey(p)] || {ordered: 0};
  return Math.max(0, k.ordered - (S.editBase[p.code] || 0));
}
function kitInfo(p, qty) {
  const size = p.kitSize || 10, base = kitBase(p), total = base + qty;
  const completeTotal = Math.floor(total / size) * size;
  const mineComplete = Math.max(0, Math.min(qty, completeTotal - base));
  const rest = total % size;
  return {size, base, baseRest: base % size, rest, needed: rest ? size - rest : 0, mineComplete, mineWait: qty - mineComplete};
}
function minFor(p) {
  if (S.cfg.singleVial && p.single !== false && p.kitSize > 1 && !(p.sizes && p.sizes.length) && kitInfo(p, 0).baseRest > 0) return 1;
  return p.min;
}
function modeOf(p) { return p.kitSize > 1 && !(p.sizes && p.sizes.length) && S.mode[p.code] === 'kit' ? 'kit' : 'vial'; }
function dotsHtml(size, baseRest, mine) {
  if (size > 12) return '';
  let h = '<div class="dots" aria-hidden="true">';
  for (let i = 0; i < size; i++) h += '<span class="dot ' + (i < baseRest ? 'on' : (i < baseRest + mine ? 'mine' : '')) + '"></span>';
  return h + '</div>';
}
function kitLine(p, qty) {
  const i = kitInfo(p, qty);
  if (p.kitSize === 1) return '';
  if (qty === 0) {
    if (i.baseRest === 0) return '';
    return dotsHtml(i.size, i.baseRest, 0) +
      '<div class="kitnote">' + i.baseRest + ' of ' + i.size + ' vials are in the bunuan · ' + i.needed + ' more to complete this kit</div>';
  }
  let note, cls = '';
  if (i.mineWait === 0) { note = 'Your vials complete a kit'; cls = ' ok'; }
  else if (i.mineComplete === 0) note = 'Your vials join the bunuan · ' + i.needed + ' more needed to complete the kit';
  else note = i.mineComplete + ' of your vials complete a kit · ' + i.mineWait + ' wait in the bunuan (' + i.needed + ' more needed)';
  return dotsHtml(i.size, i.baseRest, Math.min(qty, i.size - i.baseRest)) + '<div class="kitnote' + cls + '">' + note + '</div>';
}

/* ---------------- totals */
function calc() {
  const f = S.form, items = [];
  let sub = 0, vials = 0;
  Object.keys(S.cart).forEach(code => {
    const p = prodOf(f, code), q = S.cart[code];
    if (!p || !(q > 0)) return;
    const price = (S.editing && S.editBasePrice[code] != null) ? S.editBasePrice[code] : p.vialPrice;
    items.push({p, q, price, total: Math.round(q * price * 100) / 100});
    sub += q * price; vials += q;
  });
  sub = Math.round(sub * 100) / 100;
  const d = S.draft, cfg = S.cfg;
  const combined = f === 'FUAN' && d.combined && S.mm && S.mm.ref === d.mammothRef.trim().toUpperCase();
  const region = combined ? S.mm.region : d.region;
  const packaging = combined && cfg.fuanCombinedWaivesPackaging ? 0 : cfg.packagingFee;
  const shipping = combined ? 0 : (region ? cfg.ship[region] : 0);
  return {items, sub, vials, packaging, shipping, region, combined, total: Math.round((sub + packaging + shipping) * 100) / 100};
}

const phDate = ms => new Date(ms).toLocaleString('en-PH', {timeZone: 'Asia/Manila', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true});
function proofLabel(P) { return P.kind === 'ORDER' ? (P.ref.trim().toUpperCase() || 'ORDER') : ((P.ref.trim() ? P.ref.trim().toUpperCase() + ' · ' : '') + P.purpose.toUpperCase()); }
function loadImage(file) {

    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => { res(im); };

}
function drawProof(P, ms) {
  const im = P.img, MAXW = 1400;
  let w = im.naturalWidth || im.width, h = im.naturalHeight || im.height;
  const sc = Math.min(1, MAXW / Math.max(w, h)); w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
  const bar = Math.max(64, Math.round(w * 0.075)), when_ = phDate(ms), label = proofLabel(P);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h + bar;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height);
  g.drawImage(im, 0, 0, w, h);
  const fs = Math.max(16, Math.round(w * 0.03)), txt = 'BELLAVIÉ CO. · ' + label + ' · ' + when_;
  g.save(); g.beginPath(); g.rect(0, 0, w, h); g.clip(); g.translate(w / 2, h / 2); g.rotate(-Math.PI / 6);
  g.font = '700 ' + fs + 'px Jost, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw = g.measureText(txt).width + fs * 2, stepY = fs * 3.4, diag = Math.hypot(w, h);
  g.lineWidth = Math.max(2, fs / 8); g.strokeStyle = 'rgba(255,255,255,.55)'; g.fillStyle = 'rgba(184,36,90,.34)';
  let row = 0;
  for (let y = -diag / 2; y <= diag / 2; y += stepY, row++) {
    const off = (row % 2) * tw / 2;
    for (let x = -diag / 2 - tw; x <= diag / 2 + tw; x += tw) { g.strokeText(txt, x + off, y); g.fillText(txt, x + off, y); }
  }
  g.restore();
  g.fillStyle = '#7A1F3D'; g.fillRect(0, h, w, bar);
  const amt = P.amount ? ' · ' + fmt(Number(P.amount) || 0) : '';
  const line = S.cfg.businessName + ' · ' + label + amt + ' · ' + when_;
  let bs = Math.round(bar * 0.36); g.font = '600 ' + bs + 'px Jost, Arial, sans-serif';
  while (g.measureText(line).width > w - 28 && bs > 10) { bs--; g.font = '600 ' + bs + 'px Jost, Arial, sans-serif'; }
  g.fillStyle = '#ffffff'; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(line, 14, h + bar / 2);
  return cv;
}
function proofJpeg(cv) {
  let q = 0.85, d = cv.toDataURL('image/jpeg', q);
  while (d.length > 3800000 && q > 0.4) { q -= 0.1; d = cv.toDataURL('image/jpeg', q); }
  return d;
}

    '<div class="field"><label class="f">Product name</label><input class="in" id="pn" value="' + esc(P.name) + '"></div>' +
    '<div class="field"><label class="f">Specification</label><input class="in" id="ps" value="' + esc(P.spec) + '" placeholder="e.g. 10 mg/vial"></div>' +
    '<div class="field"><label class="f">Category</label><input class="in" id="pcat" list="catlist" value="' + esc(P.category || '') + '" placeholder="Pick one or type a new category"><datalist id="catlist">' + (d.categories || []).map(c => '<option value="' + esc(c) + '">').join('') + '</datalist></div>' +
    '<div class="two"><div class="field"><label class="f">Price per kit in USD</label><input class="in" id="pu" type="number" step="0.01" value="' + esc(P.usd == null ? '' : P.usd) + '"></div><div class="field"><label class="f">Or price per kit in ₱</label><input class="in" id="pk" type="number" step="0.01" value="' + esc(P.usd == null && P.kitPrice ? P.kitPrice : '') + '"></div></div>' +
    '<div class="alert ok" id="pprev"></div>' +
    '<div class="two"><div class="field"><label class="f">Minimum vials per order</label><input class="in" id="pm" type="number" min="1" value="' + esc(P.min) + '"></div><div class="field"><label class="f">Vials per kit</label><input class="in" id="pz" type="number" min="1" value="' + esc(P.kitSize) + '"></div></div>' +
    '<div class="two"><div class="field"><label class="f">Allowed order sizes <span class="muted">(optional)</span></label><input class="in" id="pa" value="' + esc((P.sizes || []).join(', ')) + '" placeholder="e.g. 5, 10"></div><div class="field"><label class="f">Unit</label><input class="in" id="pun" value="' + esc(P.unit || 'vial') + '"></div></div>' +
    '<div class="field"><label class="f">Allow 1-vial orders while this kit is in bunuan?</label><select class="in" id="psv"><option value="1"' + (P.single !== false ? ' selected' : '') + '>Yes (when the master switch in Settings is on)</option><option value="0"' + (P.single === false ? ' selected' : '') + '>No, keep the minimum</option></select></div>' +
    '<div class="field"><label class="f">Available on the website</label><select class="in" id="pv"><option value="1"' + (P.active ? ' selected' : '') + '>Yes, show it</option><option value="0"' + (!P.active ? ' selected' : '') + '>No, hide it</option></select></div>' +
    '<div id="perr"></div><button class="btn" id="psave">Save product</button>');
  const prev = () => {
    const usd = parseFloat($('#pu').value), kp = parseFloat($('#pk').value), z = Math.max(1, parseInt($('#pz').value) || 10);
    const kit = isFinite(usd) ? Math.round(usd * rate * 100) / 100 : (isFinite(kp) ? kp : null);
    $('#pprev').textContent = kit == null ? 'Enter a price to see the price per vial.' : 'Kit ' + fmt(kit) + ' · ' + fmt(Math.round(kit / z * 100) / 100) + ' per vial' + (isFinite(usd) ? ' (rate ' + rate + ')' : '');
  };
  ['#pu', '#pk', '#pz'].forEach(s => $(s).addEventListener('input', prev)); prev();
  $('#mx').onclick = closeModal;
  $('#psave').onclick = async () => {
    const btn = $('#psave'); btn.disabled = true; btn.textContent = 'Saving…';
    const usd = $('#pu').value.trim(), kp = $('#pk').value.trim();
    try {
      await adminCall('adminSaveProduct', {origCode: orig, form: $('#pf').value, code: $('#pc').value, name: $('#pn').value, spec: $('#ps').value, category: $('#pcat').value,
        usd: usd === '' ? null : Number(usd), kitPrice: kp === '' ? null : Number(kp), min: Number($('#pm').value), kitSize: Number($('#pz').value),
        sizes: $('#pa').value.split(/[^0-9]+/).map(Number).filter(n => n > 0), unit: $('#pun').value, active: $('#pv').value === '1', single: $('#psv').value === '1'});
      closeModal(); adminView(); toast('Product saved');
    } catch (e) { btn.disabled = false; btn.textContent = 'Save product'; $('#perr').innerHTML = '<div class="alert err" role="alert">' + esc(e.message) + '</div>'; }
  };
}

/* --- settings tab */
function adminSettings() {
  const s = A.data.settings, d0 = A.data;
  const inp = (id, label, val, type, hint) => '<div class="field"><label class="f" for="' + id + '">' + label + '</label><input class="in" id="' + id + '" type="' + (type || 'text') + '" ' + (type === 'number' ? 'step="0.01"' : '') + ' value="' + esc(val) + '">' + (hint ? '<p class="hint">' + hint + '</p>' : '') + '</div>';
  const yn = (id, label, val) => '<div class="field"><label class="f" for="' + id + '">' + label + '</label><select class="in" id="' + id + '"><option value="Yes"' + (/^yes$/i.test(val) ? ' selected' : '') + '>Yes</option><option value="No"' + (!/^yes$/i.test(val) ? ' selected' : '') + '>No</option></select></div>';
  $('#tab').innerHTML =
    '<div class="card"><h2 class="h-md" style="margin-bottom:12px">Fees and prices</h2>' +
    inp('s_usdRate', 'USD to PHP rate (Mammoth)', s.usdRate, 'number', 'Changing this updates every Mammoth price per kit and per vial. Existing orders keep their price.') +
    inp('s_packagingFee', 'Packaging fee per order (₱)', s.packagingFee, 'number') +
    '<div class="two">' + inp('s_shipLuzon', 'Luzon shipping', s.shipLuzon, 'number') + inp('s_shipVisayas', 'Visayas shipping', s.shipVisayas, 'number') + '</div>' + inp('s_shipMindanao', 'Mindanao shipping', s.shipMindanao, 'number') +
    yn('s_fuanCombinedWaivesPackaging', 'Fuan combined with Mammoth: also waive packaging?', s.fuanCombinedWaivesPackaging) + '</div>' +
    '<div class="card"><h2 class="h-md" style="margin-bottom:12px">Bunuan rules</h2>' +
    yn('s_singleVialInBunuan', 'Allow 1-vial orders when a kit is in bunuan?', s.singleVialInBunuan) + '<p class="hint">Off by default: every item keeps its minimum. Turn it on when you want customers to help fill an open kit with a single vial. You can also switch it off for individual products in the Products tab.</p></div>' +
    '<div class="card"><h2 class="h-md" style="margin-bottom:12px">Order forms</h2>' +
    inp('s_mammothTitle', 'Mammoth form title', s.mammothTitle) + yn('s_mammothOpen', 'Mammoth open for new orders?', s.mammothOpen) +
    inp('s_fuanTitle', 'Fuan form title', s.fuanTitle) + yn('s_fuanOpen', 'Fuan open for new orders?', s.fuanOpen) + '</div>' +
    '<div class="card"><h2 class="h-md" style="margin-bottom:12px">Messages and contact</h2>' +
    inp('s_businessName', 'Business name', s.businessName) + inp('s_adminWhatsapp', 'Admin WhatsApp number', s.adminWhatsapp.replace(/^63/, '0'), 'tel', 'Invoices are sent to this number.') +
    inp('s_communityLink', 'WhatsApp community link', s.communityLink) + inp('s_customerViewLink', 'Customer order-board link (read-only sheet)', s.customerViewLink || '', 'text', 'Buyers see this on the welcome page. Leave empty to hide it.') +
    '<div class="field"><label class="f" for="s_announcement">Welcome-page announcement</label><textarea class="in" id="s_announcement">' + esc(s.announcement) + '</textarea><p class="hint">Leave empty to hide the banner.</p></div>' +
    '<div class="field"><label class="f" for="s_paymentNote">Payment note after an order is saved</label><textarea class="in" id="s_paymentNote">' + esc(s.paymentNote) + '</textarea></div></div>' +
    '<div class="card"><h2 class="h-md" style="margin-bottom:12px">Payment details and QR code</h2>' +
    '<div class="field"><label class="f" for="s_payDetails">Bank / e-wallet details</label><textarea class="in" id="s_payDetails" rows="5" placeholder="e.g.\nGCash: 0969 512 8520\nAccount name: Bellavié Co.">' + esc(s.payDetails || '') + '</textarea><p class="hint">One account per line. Buyers see this on the Upload payment page.</p></div>' +
    '<div id="qrcur" class="center" style="margin-bottom:10px"></div>' +
    '<label class="btn soft" for="qrfile" style="cursor:pointer">' + ICON.up + ' ' + (d0.hasQr ? 'Replace QR code' : 'Upload QR code') + '</label><input id="qrfile" type="file" accept="image/*" hidden>' +
    '<div id="qrnew" class="center" style="margin-top:10px"></div><div id="qerr"></div>' +
    '<button class="btn" id="paysave" style="margin-top:12px">Save payment details</button>' + (d0.hasQr ? '<button class="btn ghost" id="qrrm" style="margin-top:10px">Remove QR code</button>' : '') + '</div>' +
    '<div id="serr"></div><button class="btn" id="ssave">Save settings</button>' +
    '<div class="card" style="margin-top:18px"><h2 class="h-md" style="margin-bottom:12px">Change admin passcode</h2>' + inp('pw_old', 'Current passcode', '', 'password') + inp('pw_new', 'New passcode (6+ characters)', '', 'password') + '<button class="btn ghost" id="pwsave">Change passcode</button></div>';
  let newQr = '';
  if (d0.hasQr) call('getPayInfo').then(i => { const el = $('#qrcur'); if (el && i.qr) el.innerHTML = '<img class="qrimg" alt="Current QR code" src="' + i.qr + '">'; }).catch(() => {});
  $('#qrfile').onchange = async ev => {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    try {
      const im = await loadImage(f), sc = Math.min(1, 800 / Math.max(im.naturalWidth, im.naturalHeight));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * sc); cv.height = Math.round(im.naturalHeight * sc);
      const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(im, 0, 0, cv.width, cv.height);
      newQr = cv.toDataURL('image/png'); if (newQr.length > 3800000) newQr = cv.toDataURL('image/jpeg', 0.9);
      $('#qrnew').innerHTML = '<p class="small muted">New QR (not saved yet)</p><img class="qrimg" alt="New QR code" src="' + newQr + '">';
    } catch (e) { $('#qerr').innerHTML = '<div class="alert err" role="alert">' + esc(e.message) + '</div>'; }
  };
  $('#paysave').onclick = async () => {
    const btn = $('#paysave'); btn.disabled = true; btn.textContent = 'Saving…';
    try { await adminCall('adminSavePayInfo', $('#s_payDetails').value, newQr || null, false); adminView(); toast('Payment details saved'); }
    catch (e) { btn.disabled = false; btn.textContent = 'Save payment details'; $('#qerr').innerHTML = '<div class="alert err" role="alert">' + esc(e.message) + '</div>'; }
  };
  if ($('#qrrm')) $('#qrrm').onclick = async () => {
    if (!(await confirmBox('Remove the QR code?', 'Buyers will no longer see it on the Upload payment page.', 'Remove', 'Keep it'))) return;
    try { await adminCall('adminSavePayInfo', $('#s_payDetails').value, null, true); adminView(); toast('QR code removed'); } catch (e) {}
  };
  $('#ssave').onclick = async () => {
    const btn = $('#ssave'); btn.disabled = true; btn.textContent = 'Saving…';
    const g = id => $('#' + id).value;
    const body = {usdRate: g('s_usdRate'), packagingFee: g('s_packagingFee'), shipLuzon: g('s_shipLuzon'), shipVisayas: g('s_shipVisayas'), shipMindanao: g('s_shipMindanao'),
      fuanCombinedWaivesPackaging: g('s_fuanCombinedWaivesPackaging'), singleVialInBunuan: g('s_singleVialInBunuan'), mammothTitle: g('s_mammothTitle'), mammothOpen: g('s_mammothOpen'), fuanTitle: g('s_fuanTitle'), fuanOpen: g('s_fuanOpen'),
      businessName: g('s_businessName'), adminWhatsapp: g('s_adminWhatsapp'), communityLink: g('s_communityLink'), customerViewLink: g('s_customerViewLink'), announcement: g('s_announcement'), paymentNote: g('s_paymentNote')};
    try { await adminCall('adminSaveSettings', body); await refreshPublic(); adminView(); toast('Settings saved. The website is updated'); }
    catch (e) { btn.disabled = false; btn.textContent = 'Save settings'; $('#serr').innerHTML = '<div class="alert err" role="alert">' + esc(e.message) + '</div>'; }
  };
  $('#pwsave').onclick = async () => {
    try { await call('adminChangePasscode', A.token, $('#pw_old').value, $('#pw_new').value); toast('Passcode changed. Keep it somewhere safe'); $('#pw_old').value = ''; $('#pw_new').value = ''; }
    catch (e) { adminErr(e); }
  };
}
async function refreshPublic() {
  try { const b = await call('bootstrap'); S.cfg = b.settings; S.products = b.products; S.categories = b.categories || []; S.kits = b.kits; } catch (e) {}
}

/* =================================================================== BOOT */
document.addEventListener('click', ev => {
  const g = ev.target.closest('[data-go]'); if (g) { startForm(g.dataset.go); return; }
  if (ev.target.closest('#payBtn')) { openPay(null); return; }
  if (ev.target.closest('#findBtn')) { S.find.error = ''; go('find'); return; }
  if (ev.target.closest('#adminLink')) { go(A.token && A.data ? 'admin' : 'adminLogin'); return; }
  if (ev.target.closest('#lastBtn')) { const r = store.get('blvc_recent', [])[0]; S.find.ref = r.ref; go('find'); }
});
async function boot() {
  try {
    const b = await call('bootstrap');
    S.cfg = b.settings; S.products = b.products; S.categories = b.categories || []; S.kits = b.kits; S.view = 'welcome'; render();
  } catch (e) {
    $('#app').innerHTML = '<div class="card center"><p class="h-lg">We could not open the order form</p><p class="muted" style="margin:8px 0 16px">' + esc(e.message) + '</p><button class="btn" id="retry">Try again</button></div>';
    $('#retry').onclick = () => { $('#app').innerHTML = '<div class="loading"><div class="spin"></div></div>'; boot(); };
  }
}
boot();
</script>
</body>
</html>
